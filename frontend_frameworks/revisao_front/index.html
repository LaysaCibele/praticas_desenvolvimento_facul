 <!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Alunos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sistema de Alunos</h1>
        <p>Cadastro e consulta de alunos</p>
    </header>


    <main>

        <section class="card">

            <h2>Cadastrar aluno</h2>

            <form id="formAluno">

                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome"
                    >
                </div>


                <div class="campo">
                    <label for="idade">Idade:</label>
                    <input
                        type="number"
                        id="idade"
                        placeholder="Digite a idade"
                    >
                </div>


                <div class="campo">
                    <label for="nota">Nota:</label>
                    <input
                        type="number"
                        id="nota"
                        min="0"
                        max="10"
                        step="0.1"
                        placeholder="Digite a nota"
                    >
                </div>


                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </section>


        <!-- RESULTADO -->
        <section class="card">

            <h2>Resultado</h2>

            <div id="mensagem">
                Nenhum aluno cadastrado.
            </div>

        </section>


        <!-- LISTA -->
        <section class="card">

            <h2>Alunos cadastrados</h2>

            <div id="listaAlunos">
                <!--Aqui o js vai listar os alunos-->
            </div>

        </section>

    </main>


    <footer>
        <p>@copyForLay</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
